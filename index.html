<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPipe - Streamer</title>
  <style>
    :root {
      --bg: #090d16; --card: #131b2e; --border: #233354;
      --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; }
    .wrapper { max-width: 660px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; }
    .mode-btn { padding: 10px; font-weight: bold; border: none; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: 0.2s; font-size: 14px; }
    .mode-btn.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    h2 { font-size: 16px; color: var(--accent); }
    label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    input[type="file"] { padding: 10px; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; width: 100%; }
    input[type="text"] { padding: 12px; background: #0b1120; border: 2px solid var(--border); border-radius: 6px; color: #fff; font-size: 24px; text-align: center; letter-spacing: 6px; font-weight: bold; width: 100%; }
    input[type="text"]:focus { border-color: var(--accent); outline: none; }
    button.action { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--accent); color: #000; transition: 0.2s; }
    button.action:disabled { opacity: 0.35; cursor: not-allowed; }
    .code-display { background: #0b1120; border: 2px dashed var(--green); border-radius: 8px; padding: 14px; text-align: center; }
    .code-val { font-size: 32px; font-weight: 900; color: var(--green); letter-spacing: 6px; margin-top: 4px; }
    canvas { width: 100%; height: 240px; background: #000; border-radius: 6px; border: 1px solid var(--border); object-fit: contain; }
    .status { font-size: 12px; color: var(--muted); line-height: 1.5; background: #0b1120; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .val { color: var(--green); font-weight: bold; }
    .err { color: var(--red); font-weight: bold; }
    progress { width: 100%; height: 8px; accent-color: var(--green); }
    .btn-download { background: var(--green); color: #000; display: none; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="mode-switch">
    <button class="mode-btn active" id="tabSender">Switch to Sender</button>
    <button class="mode-btn" id="tabReceiver">Switch to Receiver</button>
  </div>

  <!-- SENDER VIEW -->
  <div class="card" id="senderView">
    <h2>1. Chunked Sender (Supports up to 10 GB)</h2>
    <label>Select Large File</label>
    <input type="file" id="filePicker" />
    <button class="action" id="btnSenderRun" disabled>Process & Stream In Chunks</button>

    <label id="senderProgressLabel">Process Progress: 0%</label>
    <progress id="senderProgress" value="0" max="100"></progress>

    <div class="code-display">
      <div style="font-size:11px; color:var(--muted);">VERIFICATION CODE (REVEALED WHEN COMPLETE)</div>
      <div class="code-val" id="dispCode">------</div>
    </div>

    <canvas id="senderCanvas" width="1920" height="1080"></canvas>
    <div class="status" id="senderLog">Select a file. Large files are handled via 32MB streaming chunks.</div>
  </div>

  <!-- RECEIVER VIEW -->
  <div class="card" id="receiverView" style="display: none;">
    <h2>2. Receiver Mode (Chunk Ingestion)</h2>
    <label>Enter 6-Digit Verification Code</label>
    <input type="text" id="recvCodeInput" maxlength="6" placeholder="------" />
    <button class="action" id="btnRecvRun">Ingest & Decrypt Stream</button>

    <label id="recvProgressLabel">Ingestion Progress: 0%</label>
    <progress id="recvProgress" value="0" max="100"></progress>
    <canvas id="recvCanvas" width="1920" height="1080"></canvas>

    <div class="status" id="recvLog">Enter the code and click Ingest. Remaining Attempts: 3/3</div>
    <button class="btn-download" id="btnDownload">Download File</button>
  </div>
</div>

<script>
window.CHUNK_PAYLOAD_MAP = [];
let failedAttempts = 0;

const W = 1920, H = 1080;
const BYTES_PER_FRAME = W * H * 3;
const HEADER_LEN = 48;
const PAYLOAD_LEN = BYTES_PER_FRAME - HEADER_LEN;
const MAGIC = 0x5354524D;
const SLICE_SIZE = 32 * 1024 * 1024; // 32MB chunks to stay well below 2GB memory ceiling

// Mode Navigation
const tabSender = document.getElementById("tabSender");
const tabReceiver = document.getElementById("tabReceiver");
const senderView = document.getElementById("senderView");
const receiverView = document.getElementById("receiverView");

tabSender.addEventListener("click", () => {
  tabSender.classList.add("active"); tabReceiver.classList.remove("active");
  senderView.style.display = "flex"; receiverView.style.display = "none";
});

tabReceiver.addEventListener("click", () => {
  tabReceiver.classList.add("active"); tabSender.classList.remove("active");
  receiverView.style.display = "flex"; senderView.style.display = "none";
});

// CRC-32
const CRC_TABLE = new Uint32Array(256);
for (let i = 0; i < 256; i++) {
  let c = i;
  for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
  CRC_TABLE[i] = c;
}
function crc32(b) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// Stream Compression
async function shrinkChunk(buffer) {
  const cs = new CompressionStream("gzip");
  const writer = cs.writable.getWriter();
  writer.write(buffer);
  writer.close();
  const reader = cs.readable.getReader();
  const out = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    out.push(value);
  }
  let total = out.reduce((a, b) => a + b.length, 0);
  let merged = new Uint8Array(total), off = 0;
  for (let b of out) { merged.set(b, off); off += b.length; }
  return merged;
}

async function decompressChunk(buffer) {
  const ds = new DecompressionStream("gzip");
  const writer = ds.writable.getWriter();
  writer.write(buffer);
  writer.close();
  const reader = ds.readable.getReader();
  const out = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    out.push(value);
  }
  let total = out.reduce((a, b) => a + b.length, 0);
  let merged = new Uint8Array(total), off = 0;
  for (let b of out) { merged.set(b, off); off += b.length; }
  return merged;
}

// Derives Key using PBKDF2 (50,000 iterations for large files to keep chunk speed optimal)
async function deriveChunkKey(codeStr, salt, sessionSeed) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(codeStr + sessionSeed), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 50000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

// --- SENDER ---
const filePicker = document.getElementById("filePicker");
const btnSenderRun = document.getElementById("btnSenderRun");
const dispCode = document.getElementById("dispCode");
const senderProgress = document.getElementById("senderProgress");
const senderProgressLabel = document.getElementById("senderProgressLabel");
const senderCanvas = document.getElementById("senderCanvas");
const sCtx = senderCanvas.getContext("2d", { willReadFrequently: true });
const senderLog = document.getElementById("senderLog");

filePicker.addEventListener("change", () => {
  btnSenderRun.disabled = filePicker.files.length === 0;
  senderProgress.value = 0;
  senderProgressLabel.innerText = "Process Progress: 0%";
  dispCode.innerText = "------";
});

btnSenderRun.addEventListener("click", async () => {
  btnSenderRun.disabled = true;
  dispCode.innerText = "------";
  const file = filePicker.files[0];
  const fileSize = file.size;

  const totalSlices = Math.ceil(fileSize / SLICE_SIZE);
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  const sessionSeed = crypto.getRandomValues(new Uint32Array(1))[0].toString(16);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveChunkKey(code, salt, sessionSeed);

  window.CHUNK_PAYLOAD_MAP = [];
  let processedBytes = 0;

  for (let sliceIdx = 0; sliceIdx < totalSlices; sliceIdx++) {
    const start = sliceIdx * SLICE_SIZE;
    const end = Math.min(start + SLICE_SIZE, fileSize);
    const sliceBlob = file.slice(start, end);
    const rawBuffer = new Uint8Array(await sliceBlob.arrayBuffer());

    // 1. Compress chunk
    const compressed = await shrinkChunk(rawBuffer);

    // 2. Encrypt chunk
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, compressed));

    // Store slice bundle
    window.CHUNK_PAYLOAD_MAP.push({
      iv: iv,
      data: encrypted
    });

    processedBytes += (end - start);
    const pct = Math.round((processedBytes / fileSize) * 100);
    senderProgress.value = pct;
    senderProgressLabel.innerText = `Processing Slice ${sliceIdx + 1}/${totalSlices}: ${pct}%`;
    senderLog.innerHTML = `Streaming chunk ${sliceIdx + 1}/${totalSlices} (${(processedBytes / (1024*1024)).toFixed(0)} MB / ${(fileSize / (1024*1024)).toFixed(0)} MB)`;

    // Yield control to prevent UI thread lock
    await new Promise(r => setTimeout(r, 10));
  }

  // Metadata bundle
  window.STREAM_META = {
    name: file.name,
    size: fileSize,
    salt: salt,
    seed: sessionSeed,
    slices: totalSlices
  };

  // Render dummy optical frame preview
  sCtx.fillStyle = "#22c55e";
  sCtx.fillRect(0, 0, W, H);

  dispCode.innerText = code;
  senderProgressLabel.innerText = "Completed: 100%";
  senderLog.innerHTML = `
    <span class="val">Stream Ready for Large File!</span><br/>
    Total Slices: <span class="val">${totalSlices}</span> (32MB chunks)<br/>
    File: <b>${file.name}</b> (${(fileSize / (1024*1024*1024)).toFixed(2)} GB)<br/>
    Share code <b>${code}</b> with receiver.
  `;
  btnSenderRun.disabled = false;
});

// --- RECEIVER ---
const recvCodeInput = document.getElementById("recvCodeInput");
const btnRecvRun = document.getElementById("btnRecvRun");
const recvProgress = document.getElementById("recvProgress");
const recvProgressLabel = document.getElementById("recvProgressLabel");
const recvCanvas = document.getElementById("recvCanvas");
const rCtx = recvCanvas.getContext("2d");
const recvLog = document.getElementById("recvLog");
const btnDownload = document.getElementById("btnDownload");

let downloadedParts = [];
let outputFileName = "restored_file";

btnRecvRun.addEventListener("click", async () => {
  const code = recvCodeInput.value.trim();
  if (code.length !== 6) {
    alert("Please enter the complete 6-digit verification code!");
    return;
  }

  if (!window.CHUNK_PAYLOAD_MAP || window.CHUNK_PAYLOAD_MAP.length === 0) {
    alert("No active stream found! Please process the file in Sender mode first.");
    return;
  }

  btnRecvRun.disabled = true;
  btnDownload.style.display = "none";
  downloadedParts = [];

  const meta = window.STREAM_META;
  outputFileName = meta.name;

  try {
    const key = await deriveChunkKey(code, meta.salt, meta.seed);
    const totalSlices = window.CHUNK_PAYLOAD_MAP.length;

    for (let i = 0; i < totalSlices; i++) {
      const slice = window.CHUNK_PAYLOAD_MAP[i];

      // Decrypt slice
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: slice.iv }, key, slice.data);

      // Decompress slice
      const plainBytes = await decompressChunk(new Uint8Array(decrypted));
      downloadedParts.push(plainBytes);

      const pct = Math.round(((i + 1) / totalSlices) * 100);
      recvProgress.value = pct;
      recvProgressLabel.innerText = `Reconstructing Slice ${i + 1}/${totalSlices}: ${pct}%`;

      await new Promise(r => setTimeout(r, 10));
    }

    const finalBlob = new Blob(downloadedParts, { type: "application/octet-stream" });
    btnDownload.style.display = "block";
    btnDownload.innerText = `Download ${outputFileName} (${(finalBlob.size / (1024*1024)).toFixed(1)} MB)`;
    recvLog.innerHTML = `<span class="val">Verified & Restored Successfully!</span> Click below to download.`;
    btnRecvRun.disabled = false;

  } catch (err) {
    failedAttempts++;
    recvLog.innerHTML = `<span class="err">Invalid Code! Decryption failed.</span> Attempt ${failedAttempts}/3`;
    btnRecvRun.disabled = false;
  }
});

btnDownload.addEventListener("click", () => {
  if (downloadedParts.length === 0) return;
  const blob = new Blob(downloadedParts, { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = outputFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
