<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPipe - High-Speed Same-Room Local Drop</title>
  <style>
    :root {
      --bg: #090d16; --card: #131b2e; --border: #233354;
      --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .wrapper { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; }
    .mode-btn { padding: 12px; font-weight: bold; border: none; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: 0.2s; font-size: 14px; }
    .mode-btn.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    h2 { font-size: 16px; color: var(--accent); }
    label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    input[type="file"] { padding: 10px; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; width: 100%; }
    input[type="text"] { padding: 12px; background: #0b1120; border: 2px solid var(--border); border-radius: 6px; color: #fff; font-size: 24px; text-align: center; letter-spacing: 6px; font-weight: bold; width: 100%; }
    input[type="text"]:focus { border-color: var(--accent); outline: none; }
    
    .btn-row { display: flex; gap: 10px; }
    button.action { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--accent); color: #000; transition: 0.2s; }
    button.action:disabled { opacity: 0.35; cursor: not-allowed; }
    button.cancel-btn { padding: 12px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--red); color: #fff; display: none; transition: 0.2s; }
    button.cancel-btn:hover { filter: brightness(1.15); }

    .code-display { background: #0b1120; border: 2px dashed var(--green); border-radius: 8px; padding: 14px; text-align: center; }
    .code-val { font-size: 32px; font-weight: 900; color: var(--green); letter-spacing: 6px; margin-top: 4px; }

    .status { font-size: 12px; color: var(--muted); line-height: 1.5; background: #0b1120; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .val { color: var(--green); font-weight: bold; }
    .err { color: var(--red); font-weight: bold; }
    progress { width: 100%; height: 8px; accent-color: var(--green); }
    .btn-download { background: var(--green); color: #000; display: none; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; text-decoration: none; }
    .stats { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Mode Switcher -->
  <div class="mode-switch">
    <button class="mode-btn active" id="tabSender">Phone (Sender)</button>
    <button class="mode-btn" id="tabReceiver">Laptop (Receiver)</button>
  </div>

  <!-- SENDER VIEW -->
  <div class="card" id="senderView">
    <h2>1. Local Drop (Sender)</h2>
    <label>Select 4 GB File</label>
    <input type="file" id="filePicker" />
    
    <div class="btn-row">
      <button class="action" id="btnSenderRun" disabled>Open Local Pipe</button>
      <button class="cancel-btn" id="btnSenderCancel">Cancel Transfer</button>
    </div>

    <div class="code-display">
      <div style="font-size:11px; color:var(--muted);">LOCAL ROOM CODE</div>
      <div class="code-val" id="dispCode">------</div>
    </div>

    <div class="stats">
      <span id="senderProgressLabel">Transfer: 0%</span>
      <span id="senderSpeedLabel">0.0 MB/s</span>
    </div>
    <progress id="senderProgress" value="0" max="100"></progress>
    <div class="status" id="senderLog">Select a file. Connect both devices to the same Wi-Fi / Hotspot.</div>
  </div>

  <!-- RECEIVER VIEW -->
  <div class="card" id="receiverView" style="display: none;">
    <h2>2. Local Drop (Receiver)</h2>
    <label>Enter 6-Digit Room Code</label>
    <input type="text" id="recvCodeInput" maxlength="6" placeholder="------" />
    
    <div class="btn-row">
      <button class="action" id="btnRecvRun">Connect & Receive</button>
      <button class="cancel-btn" id="btnRecvCancel">Cancel Transfer</button>
    </div>

    <div class="stats">
      <span id="recvProgressLabel">Ingestion: 0%</span>
      <span id="recvSpeedLabel">0.0 MB/s</span>
    </div>
    <progress id="recvProgress" value="0" max="100"></progress>
    <div class="status" id="recvLog">Enter the code displayed on the phone to stream over local Wi-Fi.</div>
    <a class="btn-download" id="btnDownload">Save File to Laptop</a>
  </div>
</div>

<script>
// 256 KB chunks ensure maximum throughput across local Wi-Fi chipsets
const CHUNK_SIZE = 256 * 1024;

// Direct LAN ICE configuration - forces direct local IP routing
const LAN_ICE_CONFIG = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
  iceCandidatePoolSize: 10
};

let pc = null;
let dataChannel = null;
let controlChannel = null;
let currentFile = null;
let roomCode = "";
let sseSource = null;
let isCancelled = false;

// Speed tracking variables
let lastTime = 0;
let lastBytes = 0;

// UI Tabs
const tabSender = document.getElementById("tabSender");
const tabReceiver = document.getElementById("tabReceiver");
const senderView = document.getElementById("senderView");
const receiverView = document.getElementById("receiverView");

tabSender.addEventListener("click", () => {
  tabSender.classList.add("active"); tabReceiver.classList.remove("active");
  senderView.style.display = "flex"; receiverView.style.display = "none";
});

tabReceiver.addEventListener("click", () => {
  tabReceiver.classList.add("active"); tabSender.classList.remove("active");
  receiverView.style.display = "flex"; senderView.style.display = "none";
});

function cleanup() {
  if (sseSource) { sseSource.close(); sseSource = null; }
  if (dataChannel) { try { dataChannel.close(); } catch(e){} dataChannel = null; }
  if (controlChannel) { try { controlChannel.close(); } catch(e){} controlChannel = null; }
  if (pc) { try { pc.close(); } catch(e){} pc = null; }
}

function pack(desc) { return JSON.stringify({ t: desc.type, s: desc.sdp }); }
function unpack(str) { const d = JSON.parse(str); return new RTCSessionDescription({ type: d.t, s: d.s }); }

// --- SENDER ---
const filePicker = document.getElementById("filePicker");
const btnSenderRun = document.getElementById("btnSenderRun");
const btnSenderCancel = document.getElementById("btnSenderCancel");
const dispCode = document.getElementById("dispCode");
const senderProgress = document.getElementById("senderProgress");
const senderProgressLabel = document.getElementById("senderProgressLabel");
const senderSpeedLabel = document.getElementById("senderSpeedLabel");
const senderLog = document.getElementById("senderLog");

filePicker.addEventListener("change", () => {
  currentFile = filePicker.files[0];
  btnSenderRun.disabled = !currentFile;
  if (currentFile) {
    senderLog.innerHTML = `Loaded: <b>${currentFile.name}</b> (${(currentFile.size / (1024*1024*1024)).toFixed(2)} GB). Click "Open Local Pipe".`;
  }
});

btnSenderRun.addEventListener("click", async () => {
  cleanup();
  isCancelled = false;
  btnSenderRun.disabled = true;
  btnSenderCancel.style.display = "block";
  senderProgress.value = 0;
  senderProgressLabel.innerText = "Transfer: 0%";
  senderSpeedLabel.innerText = "0.0 MB/s";

  roomCode = Math.floor(100000 + Math.random() * 900000).toString();
  dispCode.innerText = roomCode;
  senderLog.innerHTML = `Binding local socket for room <b>${roomCode}</b>...`;

  pc = new RTCPeerConnection(LAN_ICE_CONFIG);

  dataChannel = pc.createDataChannel("lanPipe", { ordered: true });
  dataChannel.binaryType = "arraybuffer";

  controlChannel = pc.createDataChannel("ctrlPipe", { ordered: true });
  controlChannel.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "cancel") {
      isCancelled = true;
      cleanup();
      btnSenderCancel.style.display = "none";
      senderLog.innerHTML = `<span class="err">Transfer cancelled by receiver.</span>`;
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  pc.onicecandidate = async () => {
    if (pc.iceGatheringState === "complete") {
      // Exchange small SDP handshake over lightweight broker
      await fetch(`https://ntfy.sh/pxp_local_${roomCode}`, {
        method: "POST",
        body: JSON.stringify({ role: "sender", desc: pack(pc.localDescription) })
      });

      senderLog.innerHTML = `
        <span class="val">Local Pipe Ready!</span><br/>
        Enter code <b>${roomCode}</b> on your laptop.<br/>
        <i>Waiting for direct local link...</i>
      `;

      listenForReceiver(roomCode);
    }
  };
});

function listenForReceiver(code) {
  sseSource = new EventSource(`https://ntfy.sh/pxp_local_${code}/sse`);
  sseSource.onmessage = async (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.event === "message" && data.message) {
        const payload = JSON.parse(data.message);
        if (payload.role === "receiver") {
          sseSource.close();
          sseSource = null;

          senderLog.innerHTML = `<span class="val">Connected to Laptop!</span> Punching direct LAN socket...`;
          const answerDesc = unpack(payload.desc);
          await pc.setRemoteDescription(answerDesc);

          dataChannel.onopen = async () => {
            senderLog.innerHTML = `<span class="val">Direct Pipe Established!</span> Pumping 256 KB frames...`;

            controlChannel.send(JSON.stringify({
              type: "meta",
              name: currentFile.name,
              size: currentFile.size
            }));

            const total = currentFile.size;
            let offset = 0;
            lastTime = performance.now();
            lastBytes = 0;

            // 1MB threshold keeps Wi-Fi pipe completely saturated without overflow
            dataChannel.bufferedAmountLowThreshold = 1024 * 1024;

            while (offset < total) {
              if (isCancelled) return;

              if (dataChannel.bufferedAmount > 8 * 1024 * 1024) {
                await new Promise(r => { dataChannel.onbufferedamountlow = r; });
              }

              const slice = currentFile.slice(offset, offset + CHUNK_SIZE);
              const buf = await slice.arrayBuffer();
              dataChannel.send(buf);
              offset += buf.byteLength;

              // Speed & percentage calculation
              const now = performance.now();
              if (now - lastTime >= 500) {
                const diffBytes = offset - lastBytes;
                const diffSeconds = (now - lastTime) / 1000;
                const speedMB = (diffBytes / (1024 * 1024)) / diffSeconds;
                senderSpeedLabel.innerText = `${speedMB.toFixed(1)} MB/s`;
                lastTime = now;
                lastBytes = offset;
              }

              const pct = Math.round((offset / total) * 100);
              senderProgress.value = pct;
              senderProgressLabel.innerText = `Transfer: ${pct}% (${(offset / (1024*1024)).toFixed(0)} MB / ${(total / (1024*1024)).toFixed(0)} MB)`;
            }

            if (!isCancelled) {
              controlChannel.send(JSON.stringify({ type: "complete" }));
              senderLog.innerHTML = `<span class="val">Transfer Complete!</span> 100% delivered to laptop.`;
              btnSenderCancel.style.display = "none";
              senderSpeedLabel.innerText = "Done";
            }
          };
        }
      }
    } catch (err) {}
  };
}

btnSenderCancel.addEventListener("click", () => {
  isCancelled = true;
  if (controlChannel && controlChannel.readyState === "open") {
    try { controlChannel.send(JSON.stringify({ type: "cancel" })); } catch (e) {}
  }
  cleanup();
  btnSenderRun.disabled = !currentFile;
  btnSenderCancel.style.display = "none";
  senderProgress.value = 0;
  senderProgressLabel.innerText = "Transfer: 0%";
  senderSpeedLabel.innerText = "0.0 MB/s";
  senderLog.innerHTML = `<span class="err">Transfer cancelled by you.</span>`;
});

// --- RECEIVER ---
const recvCodeInput = document.getElementById("recvCodeInput");
const btnRecvRun = document.getElementById("btnRecvRun");
const btnRecvCancel = document.getElementById("btnRecvCancel");
const recvProgress = document.getElementById("recvProgress");
const recvProgressLabel = document.getElementById("recvProgressLabel");
const recvSpeedLabel = document.getElementById("recvSpeedLabel");
const recvLog = document.getElementById("recvLog");
const btnDownload = document.getElementById("btnDownload");

let receivedBuffers = [];
let receivedTotal = 0;
let fileMeta = null;

btnRecvRun.addEventListener("click", async () => {
  const code = recvCodeInput.value.trim();
  if (code.length !== 6) {
    alert("Please enter the 6-digit code shown on the phone!");
    return;
  }

  cleanup();
  isCancelled = false;
  btnRecvRun.disabled = true;
  btnRecvCancel.style.display = "block";
  btnDownload.style.display = "none";
  receivedBuffers = [];
  receivedTotal = 0;
  recvProgress.value = 0;
  recvProgressLabel.innerText = "Ingestion: 0%";
  recvSpeedLabel.innerText = "0.0 MB/s";
  recvLog.innerHTML = `Handshaking with Phone (Room: ${code})...`;

  try {
    const res = await fetch(`https://ntfy.sh/pxp_local_${code}/json?poll=1`);
    const text = await res.text();
    let offerDesc = null;

    if (text) {
      const lines = text.trim().split("\n");
      for (let line of lines) {
        try {
          const item = JSON.parse(line);
          if (item.event === "message" && item.message) {
            const payload = JSON.parse(item.message);
            if (payload.role === "sender") {
              offerDesc = unpack(payload.desc);
            }
          }
        } catch(e) {}
      }
    }

    if (!offerDesc) {
      recvLog.innerHTML = `<span class="err">Phone not found. Make sure you tapped "Open Local Pipe" on phone first!</span>`;
      btnRecvRun.disabled = false;
      btnRecvCancel.style.display = "none";
      return;
    }

    pc = new RTCPeerConnection(LAN_ICE_CONFIG);

    pc.ondatachannel = (e) => {
      const ch = e.channel;
      if (ch.label === "ctrlPipe") {
        controlChannel = ch;
        controlChannel.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === "meta") {
            fileMeta = msg;
            lastTime = performance.now();
            lastBytes = 0;
            recvLog.innerHTML = `Streaming <b>${fileMeta.name}</b> (${(fileMeta.size / (1024*1024*1024)).toFixed(2)} GB) over Wi-Fi...`;
          } else if (msg.type === "cancel") {
            isCancelled = true;
            cleanup();
            recvLog.innerHTML = `<span class="err">Transfer cancelled by phone.</span>`;
          } else if (msg.type === "complete") {
            recvLog.innerHTML = `<span class="val">Transfer Complete!</span> Assembling binary...`;
            const finalBlob = new Blob(receivedBuffers, { type: "application/octet-stream" });
            const url = URL.createObjectURL(finalBlob);
            btnDownload.href = url;
            btnDownload.download = fileMeta.name;
            btnDownload.style.display = "block";
            btnDownload.innerText = `Save ${fileMeta.name} (${(finalBlob.size / (1024*1024*1024)).toFixed(2)} GB)`;
            btnRecvCancel.style.display = "none";
            recvSpeedLabel.innerText = "Finished";
          }
        };
      } else if (ch.label === "lanPipe") {
        dataChannel = ch;
        dataChannel.binaryType = "arraybuffer";
        dataChannel.onmessage = (ev) => {
          if (isCancelled) return;
          receivedBuffers.push(ev.data);
          receivedTotal += ev.data.byteLength;

          // Real-time receiver speedometer
          const now = performance.now();
          if (now - lastTime >= 500) {
            const diffBytes = receivedTotal - lastBytes;
            const diffSeconds = (now - lastTime) / 1000;
            const speedMB = (diffBytes / (1024 * 1024)) / diffSeconds;
            recvSpeedLabel.innerText = `${speedMB.toFixed(1)} MB/s`;
            lastTime = now;
            lastBytes = receivedTotal;
          }

          if (fileMeta && fileMeta.size) {
            const pct = Math.round((receivedTotal / fileMeta.size) * 100);
            recvProgress.value = pct;
            recvProgressLabel.innerText = `Ingestion: ${pct}% (${(receivedTotal / (1024*1024)).toFixed(0)} MB / ${(fileMeta.size / (1024*1024)).toFixed(0)} MB)`;
          }
        };
      }
    };

    await pc.setRemoteDescription(offerDesc);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    pc.onicecandidate = async () => {
      if (pc.iceGatheringState === "complete") {
        await fetch(`https://ntfy.sh/pxp_local_${code}`, {
          method: "POST",
          body: JSON.stringify({ role: "receiver", desc: pack(pc.localDescription) })
        });
        recvLog.innerHTML = `<span class="val">Connected!</span> Waiting for stream...`;
      }
    };

  } catch (err) {
    recvLog.innerHTML = `<span class="err">Connection failed: ${err.message}</span>`;
    btnRecvRun.disabled = false;
    btnRecvCancel.style.display = "none";
  }
});

btnRecvCancel.addEventListener("click", () => {
  isCancelled = true;
  if (controlChannel && controlChannel.readyState === "open") {
    try { controlChannel.send(JSON.stringify({ type: "cancel" })); } catch (e) {}
  }
  cleanup();
  btnRecvRun.disabled = false;
  btnRecvCancel.style.display = "none";
  recvProgress.value = 0;
  recvProgressLabel.innerText = "Ingestion: 0%";
  recvSpeedLabel.innerText = "0.0 MB/s";
  recvLog.innerHTML = `<span class="err">Transfer cancelled by you.</span>`;
});
</script>
</body>
</html>
