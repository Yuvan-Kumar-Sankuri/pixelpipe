<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPipe - Streamer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #090d16; --card: #131b2e; --border: #233354;
      --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .wrapper { max-width: 620px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; }
    .mode-btn { padding: 12px; font-weight: bold; border: none; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: 0.2s; font-size: 14px; }
    .mode-btn.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    h2 { font-size: 16px; color: var(--accent); }
    label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    input[type="file"] { padding: 10px; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; width: 100%; }
    input[type="text"] { padding: 12px; background: #0b1120; border: 2px solid var(--border); border-radius: 6px; color: #fff; font-size: 24px; text-align: center; letter-spacing: 6px; font-weight: bold; width: 100%; }
    input[type="text"]:focus { border-color: var(--accent); outline: none; }
    button.action { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--accent); color: #000; transition: 0.2s; }
    button.action:disabled { opacity: 0.35; cursor: not-allowed; }
    .code-display { background: #0b1120; border: 2px dashed var(--green); border-radius: 8px; padding: 14px; text-align: center; }
    .code-val { font-size: 32px; font-weight: 900; color: var(--green); letter-spacing: 6px; margin-top: 4px; }
    .status { font-size: 12px; color: var(--muted); line-height: 1.5; background: #0b1120; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .val { color: var(--green); font-weight: bold; }
    .err { color: var(--red); font-weight: bold; }
    progress { width: 100%; height: 8px; accent-color: var(--green); }
    .btn-download { background: var(--green); color: #000; display: none; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="mode-switch">
    <button class="mode-btn active" id="tabSender">Sender Mode</button>
    <button class="mode-btn" id="tabReceiver">Receiver Mode</button>
  </div>

  <!-- SENDER VIEW -->
  <div class="card" id="senderView">
    <h2>1. Sender Mode (4GB+ Streaming)</h2>
    <label>Select File (Any Size)</label>
    <input type="file" id="filePicker" />
    <button class="action" id="btnSenderRun" disabled>Create Room & Generate Code</button>

    <label id="senderProgressLabel">Transfer Progress: 0%</label>
    <progress id="senderProgress" value="0" max="100"></progress>

    <div class="code-display">
      <div style="font-size:11px; color:var(--muted);">SHARE THIS CODE WITH RECEIVER</div>
      <div class="code-val" id="dispCode">------</div>
    </div>

    <div class="status" id="senderLog">Select a file. Large files stream on-the-fly without freezing RAM.</div>
  </div>

  <!-- RECEIVER VIEW -->
  <div class="card" id="receiverView" style="display: none;">
    <h2>2. Receiver Mode (Any City)</h2>
    <label>Enter 6-Digit Code From Sender</label>
    <input type="text" id="recvCodeInput" maxlength="6" placeholder="------" />
    <button class="action" id="btnRecvRun">Connect & Download Stream</button>

    <label id="recvProgressLabel">Download Progress: 0%</label>
    <progress id="recvProgress" value="0" max="100"></progress>

    <div class="status" id="recvLog">Enter the code and click Connect.</div>
    <button class="btn-download" id="btnDownload">Save File</button>
  </div>
</div>

<script>
const PREFIX = "pixelpipe-4gb-";
const SLICE_SIZE = 8 * 1024 * 1024; // 8MB slice (prevents memory exhaustion)
const PACKET_SIZE = 64 * 1024;       // 64KB WebRTC packets

const RTC_CONFIG = {
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" },
      { urls: "stun:stun3.l.google.com:19302" },
      { urls: "stun:stun4.l.google.com:19302" }
    ]
  }
};

let peer = null;

// Tab switcher
const tabSender = document.getElementById("tabSender");
const tabReceiver = document.getElementById("tabReceiver");
const senderView = document.getElementById("senderView");
const receiverView = document.getElementById("receiverView");

tabSender.addEventListener("click", () => {
  tabSender.classList.add("active"); tabReceiver.classList.remove("active");
  senderView.style.display = "flex"; receiverView.style.display = "none";
});

tabReceiver.addEventListener("click", () => {
  tabReceiver.classList.add("active"); tabSender.classList.remove("active");
  receiverView.style.display = "flex"; senderView.style.display = "none";
});

// Single-slice Gzip Compression
async function compressChunk(buf) {
  const cs = new CompressionStream("gzip");
  const writer = cs.writable.getWriter();
  writer.write(buf); writer.close();
  const reader = cs.readable.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = chunks.reduce((a, b) => a + b.length, 0);
  let res = new Uint8Array(total), p = 0;
  for (let c of chunks) { res.set(c, p); p += c.length; }
  return res;
}

// Single-slice Gzip Decompression
async function decompressChunk(buf) {
  const ds = new DecompressionStream("gzip");
  const writer = ds.writable.getWriter();
  writer.write(buf); writer.close();
  const reader = ds.readable.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = chunks.reduce((a, b) => a + b.length, 0);
  let res = new Uint8Array(total), p = 0;
  for (let c of chunks) { res.set(c, p); p += c.length; }
  return res;
}

// AES Key derivation
async function deriveKey(codeStr, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey("raw", enc.encode(codeStr), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 50000, hash: "SHA-256" },
    keyMat,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

// --- SENDER ---
const filePicker = document.getElementById("filePicker");
const btnSenderRun = document.getElementById("btnSenderRun");
const dispCode = document.getElementById("dispCode");
const senderProgress = document.getElementById("senderProgress");
const senderProgressLabel = document.getElementById("senderProgressLabel");
const senderLog = document.getElementById("senderLog");

let currentFile = null;

filePicker.addEventListener("change", () => {
  currentFile = filePicker.files[0];
  btnSenderRun.disabled = !currentFile;
  if (currentFile) {
    senderLog.innerHTML = `Selected: <b>${currentFile.name}</b> (${(currentFile.size / (1024*1024)).toFixed(1)} MB). Click button below.`;
  }
});

btnSenderRun.addEventListener("click", async () => {
  btnSenderRun.disabled = true;
  const file = currentFile;
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(code, salt);

  if (peer) peer.destroy();
  peer = new Peer(PREFIX + code, RTC_CONFIG);

  peer.on("open", () => {
    dispCode.innerText = code;
    senderLog.innerHTML = `
      <span class="val">Room Ready!</span><br/>
      Give this code to receiver: <b>${code}</b><br/>
      <i>File will stream slice-by-slice when receiver connects. Keep this tab active!</i>
    `;
  });

  peer.on("connection", (conn) => {
    senderLog.innerHTML = `<span class="val">Receiver Connected!</span> Streaming slices now...`;

    conn.on("open", async () => {
      const fileSize = file.size;
      const totalSlices = Math.ceil(fileSize / SLICE_SIZE);

      // Send initial metadata
      conn.send({
        type: "meta",
        name: file.name,
        size: fileSize,
        salt: Array.from(salt),
        totalSlices: totalSlices
      });

      // Stream slice by slice
      for (let i = 0; i < totalSlices; i++) {
        const start = i * SLICE_SIZE;
        const end = Math.min(start + SLICE_SIZE, fileSize);
        
        // 1. Read ONLY 8MB at a time
        const sliceBlob = file.slice(start, end);
        const sliceBuffer = new Uint8Array(await sliceBlob.arrayBuffer());

        // 2. Compress chunk
        const compressed = await compressChunk(sliceBuffer);

        // 3. Encrypt chunk
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, compressed));

        // 4. Send slice header
        conn.send({
          type: "slice_start",
          sliceIdx: i,
          iv: Array.from(iv),
          len: encrypted.length
        });

        // 5. Send raw data in 64KB WebRTC packets
        let p = 0;
        while (p < encrypted.length) {
          const packet = encrypted.subarray(p, p + PACKET_SIZE);
          conn.send({ type: "packet", data: Array.from(packet) });
          p += packet.length;

          // Backpressure check: wait if buffer full
          if (conn.dataChannel.bufferedAmount > 2 * 1024 * 1024) {
            await new Promise(r => setTimeout(r, 20));
          }
        }

        const pct = Math.round(((i + 1) / totalSlices) * 100);
        senderProgress.value = pct;
        senderProgressLabel.innerText = `Transferring: ${pct}% (${i + 1}/${totalSlices} slices)`;
        await new Promise(r => setTimeout(r, 5));
      }

      conn.send({ type: "complete" });
      senderLog.innerHTML = `<span class="val">Transfer Complete!</span> 100% delivered to receiver.`;
    });
  });

  peer.on("error", (err) => {
    senderLog.innerHTML = `<span class="err">Connection Error: ${err.type}</span>. Retrying...`;
    btnSenderRun.disabled = false;
  });
});

// --- RECEIVER ---
const recvCodeInput = document.getElementById("recvCodeInput");
const btnRecvRun = document.getElementById("btnRecvRun");
const recvProgress = document.getElementById("recvProgress");
const recvProgressLabel = document.getElementById("recvProgressLabel");
const recvLog = document.getElementById("recvLog");
const btnDownload = document.getElementById("btnDownload");

let meta = null;
let currentSliceData = [];
let downloadedBlobs = [];
let derivedRecvKey = null;

btnRecvRun.addEventListener("click", () => {
  const code = recvCodeInput.value.trim();
  if (code.length !== 6) {
    alert("Please enter the complete 6-digit code!");
    return;
  }

  btnRecvRun.disabled = true;
  btnDownload.style.display = "none";
  downloadedBlobs = [];
  currentSliceData = [];

  recvLog.innerHTML = `Locating Sender (Room: ${code})...`;

  if (peer) peer.destroy();
  peer = new Peer(RTC_CONFIG);

  peer.on("open", () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });

    conn.on("open", () => {
      recvLog.innerHTML = `<span class="val">Connected!</span> Waiting for stream headers...`;
    });

    let currentIv = null;
    let expectedSliceLen = 0;
    let sliceReceivedLen = 0;

    conn.on("data", async (msg) => {
      if (msg.type === "meta") {
        meta = msg;
        derivedRecvKey = await deriveKey(code, new Uint8Array(meta.salt));
        recvLog.innerHTML = `Receiving <b>${meta.name}</b> (${(meta.size / (1024*1024)).toFixed(1)} MB)...`;
      } else if (msg.type === "slice_start") {
        currentIv = new Uint8Array(msg.iv);
        expectedSliceLen = msg.len;
        currentSliceData = [];
        sliceReceivedLen = 0;
      } else if (msg.type === "packet") {
        currentSliceData.push(new Uint8Array(msg.data));
        sliceReceivedLen += msg.data.length;

        if (sliceReceivedLen === expectedSliceLen) {
          // Merge slice packets
          const fullSlice = new Uint8Array(expectedSliceLen);
          let off = 0;
          for (let p of currentSliceData) { fullSlice.set(p, off); off += p.length; }

          // Decrypt slice
          const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: currentIv }, derivedRecvKey, fullSlice);
          
          // Decompress slice
          const rawChunk = await decompressChunk(new Uint8Array(decrypted));
          downloadedBlobs.push(new Blob([rawChunk]));

          const pct = Math.round((downloadedBlobs.length / meta.totalSlices) * 100);
          recvProgress.value = pct;
          recvProgressLabel.innerText = `Downloaded: ${pct}% (${downloadedBlobs.length}/${meta.totalSlices} slices)`;
        }
      } else if (msg.type === "complete") {
        recvLog.innerHTML = `<span class="val">Download & Verification Complete!</span> Ready to save.`;
        btnDownload.style.display = "block";
        btnDownload.innerText = `Save ${meta.name}`;
        btnRecvRun.disabled = false;
      }
    });

    conn.on("error", () => {
      recvLog.innerHTML = `<span class="err">Connection interrupted.</span>`;
      btnRecvRun.disabled = false;
    });
  });

  peer.on("error", (err) => {
    recvLog.innerHTML = `<span class="err">Could not find sender room. Verify the code and try again.</span>`;
    btnRecvRun.disabled = false;
  });
});

btnDownload.addEventListener("click", () => {
  if (downloadedBlobs.length === 0) return;
  const finalBlob = new Blob(downloadedBlobs, { type: "application/octet-stream" });
  const url = URL.createObjectURL(finalBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = meta.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
