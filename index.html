<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPipe - Global Streamer</title>
  <!-- PeerJS with WebRTC STUN/TURN Handshake Engine -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #090d16; --card: #131b2e; --border: #233354;
      --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .wrapper { max-width: 620px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; }
    .mode-btn { padding: 12px; font-weight: bold; border: none; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: 0.2s; font-size: 14px; }
    .mode-btn.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    h2 { font-size: 16px; color: var(--accent); }
    label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    input[type="file"] { padding: 10px; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; width: 100%; }
    input[type="text"] { padding: 12px; background: #0b1120; border: 2px solid var(--border); border-radius: 6px; color: #fff; font-size: 24px; text-align: center; letter-spacing: 6px; font-weight: bold; width: 100%; }
    input[type="text"]:focus { border-color: var(--accent); outline: none; }
    button.action { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--accent); color: #000; transition: 0.2s; }
    button.action:disabled { opacity: 0.35; cursor: not-allowed; }
    .code-display { background: #0b1120; border: 2px dashed var(--green); border-radius: 8px; padding: 14px; text-align: center; }
    .code-val { font-size: 32px; font-weight: 900; color: var(--green); letter-spacing: 6px; margin-top: 4px; }
    .status { font-size: 12px; color: var(--muted); line-height: 1.5; background: #0b1120; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .val { color: var(--green); font-weight: bold; }
    .err { color: var(--red); font-weight: bold; }
    progress { width: 100%; height: 8px; accent-color: var(--green); }
    .btn-download { background: var(--green); color: #000; display: none; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Mode Switcher -->
  <div class="mode-switch">
    <button class="mode-btn active" id="tabSender">Sender Mode</button>
    <button class="mode-btn" id="tabReceiver">Receiver Mode</button>
  </div>

  <!-- SENDER VIEW -->
  <div class="card" id="senderView">
    <h2>1. Sender Mode (Send to Any City)</h2>
    <label>Select File</label>
    <input type="file" id="filePicker" />
    <button class="action" id="btnSenderRun" disabled>Compress, Encrypt & Generate Transfer Code</button>

    <label id="senderProgressLabel">Process Progress: 0%</label>
    <progress id="senderProgress" value="0" max="100"></progress>

    <div class="code-display">
      <div style="font-size:11px; color:var(--muted);">GIVE THIS CODE TO THE PERSON IN ANOTHER CITY</div>
      <div class="code-val" id="dispCode">------</div>
    </div>

    <div class="status" id="senderLog">Select a file. Once processed, share the 6-digit code via WhatsApp/Call.</div>
  </div>

  <!-- RECEIVER VIEW -->
  <div class="card" id="receiverView" style="display: none;">
    <h2>2. Receiver Mode (Receive from Any City)</h2>
    <label>Enter 6-Digit Code Received from Sender</label>
    <input type="text" id="recvCodeInput" maxlength="6" placeholder="------" />
    <button class="action" id="btnRecvRun">Connect & Ingest Stream</button>

    <label id="recvProgressLabel">Transfer Progress: 0%</label>
    <progress id="recvProgress" value="0" max="100"></progress>

    <div class="status" id="recvLog">Enter the code and click Connect to start the cross-city transfer.</div>
    <button class="btn-download" id="btnDownload">Download File</button>
  </div>
</div>

<script>
const PREFIX = "pixelpipe-remote-";
const CHUNK_SIZE = 64 * 1024; // 64KB WebRTC packets

// Global WebRTC STUN Configuration to punch through Internet Firewalls & NATs across different cities
const RTC_CONFIG = {
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" },
      { urls: "stun:stun3.l.google.com:19302" },
      { urls: "stun:stun4.l.google.com:19302" }
    ]
  }
};

let peer = null;
let conn = null;

// Tab switcher
const tabSender = document.getElementById("tabSender");
const tabReceiver = document.getElementById("tabReceiver");
const senderView = document.getElementById("senderView");
const receiverView = document.getElementById("receiverView");

tabSender.addEventListener("click", () => {
  tabSender.classList.add("active"); tabReceiver.classList.remove("active");
  senderView.style.display = "flex"; receiverView.style.display = "none";
});

tabReceiver.addEventListener("click", () => {
  tabReceiver.classList.add("active"); tabSender.classList.remove("active");
  receiverView.style.display = "flex"; senderView.style.display = "none";
});

// Gzip Compression
async function shrink(bytes) {
  const cs = new CompressionStream("gzip");
  const writer = cs.writable.getWriter();
  writer.write(bytes); writer.close();
  const reader = cs.readable.getReader();
  const out = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    out.push(value);
  }
  let total = out.reduce((a, b) => a + b.length, 0);
  let merged = new Uint8Array(total), off = 0;
  for (let b of out) { merged.set(b, off); off += b.length; }
  return merged;
}

// Gzip Decompression
async function decompress(bytes) {
  const ds = new DecompressionStream("gzip");
  const writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  const reader = ds.readable.getReader();
  const out = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    out.push(value);
  }
  let total = out.reduce((a, b) => a + b.length, 0);
  let merged = new Uint8Array(total), off = 0;
  for (let b of out) { merged.set(b, off); off += b.length; }
  return merged;
}

// AES-256-GCM Key Derivation
async function deriveKey(codeStr, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey("raw", enc.encode(codeStr), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
    keyMat,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

// --- SENDER ---
const filePicker = document.getElementById("filePicker");
const btnSenderRun = document.getElementById("btnSenderRun");
const dispCode = document.getElementById("dispCode");
const senderProgress = document.getElementById("senderProgress");
const senderProgressLabel = document.getElementById("senderProgressLabel");
const senderLog = document.getElementById("senderLog");

filePicker.addEventListener("change", () => {
  btnSenderRun.disabled = filePicker.files.length === 0;
});

btnSenderRun.addEventListener("click", async () => {
  btnSenderRun.disabled = true;
  const file = filePicker.files[0];
  const code = Math.floor(100000 + Math.random() * 900000).toString();

  senderProgress.value = 20;
  senderProgressLabel.innerText = "Step 1/3: Compressing (Gzip)... 20%";
  senderLog.innerHTML = "Compressing file with Gzip...";

  const rawBytes = new Uint8Array(await file.arrayBuffer());
  const shrunkedBytes = await shrink(rawBytes);

  senderProgress.value = 50;
  senderProgressLabel.innerText = "Step 2/3: Encrypting (AES-256-GCM)... 50%";
  senderLog.innerHTML = "Encrypting data with AES-256-GCM...";

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(code, salt);
  const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, shrunkedBytes));

  senderProgress.value = 80;
  senderProgressLabel.innerText = "Step 3/3: Registering on Global STUN Network... 80%";
  senderLog.innerHTML = "Connecting to global cross-city signaling relay...";

  if (peer) peer.destroy();
  // Initialize with public Google STUN servers
  peer = new Peer(PREFIX + code, RTC_CONFIG);

  peer.on("open", () => {
    dispCode.innerText = code;
    senderProgress.value = 100;
    senderProgressLabel.innerText = "Ready! Waiting for Receiver: 100%";
    senderLog.innerHTML = `
      <span class="val">Global Channel Active!</span><br/>
      Original: ${(rawBytes.length / (1024*1024)).toFixed(1)} MB &rarr; Shrunk: <span class="val">${(shrunkedBytes.length / (1024*1024)).toFixed(1)} MB</span><br/>
      Share this 6-digit code with the person in the other city: <b>${code}</b><br/>
      <i>Keep this browser tab open until the transfer completes.</i>
    `;
  });

  peer.on("connection", (c) => {
    senderLog.innerHTML = `<span class="val">Remote Receiver Connected!</span> Streaming packets across the internet...`;

    c.on("open", () => {
      // 1. Send Metadata
      c.send({
        type: "meta",
        name: file.name,
        salt: Array.from(salt),
        iv: Array.from(iv),
        totalBytes: encrypted.length
      });

      // 2. Stream Encrypted Chunks
      let offset = 0;
      function sendSlice() {
        while (offset < encrypted.length) {
          const chunk = encrypted.subarray(offset, offset + CHUNK_SIZE);
          c.send({ type: "chunk", data: Array.from(chunk) });
          offset += chunk.length;

          // Prevent buffer congestion on long-distance pipes
          if (c.dataChannel.bufferedAmount > 2 * 1024 * 1024) {
            setTimeout(sendSlice, 25);
            return;
          }
        }
        c.send({ type: "done" });
        senderLog.innerHTML = `<span class="val">Transfer Complete!</span> File received successfully in the other city.`;
      }
      sendSlice();
    });
  });

  peer.on("error", (err) => {
    senderLog.innerHTML = `<span class="err">Connection Error: ${err.type}</span>. Retrying...`;
    btnSenderRun.disabled = false;
  });
});

// --- RECEIVER ---
const recvCodeInput = document.getElementById("recvCodeInput");
const btnRecvRun = document.getElementById("btnRecvRun");
const recvProgress = document.getElementById("recvProgress");
const recvProgressLabel = document.getElementById("recvProgressLabel");
const recvLog = document.getElementById("recvLog");
const btnDownload = document.getElementById("btnDownload");

let receivedChunks = [];
let receivedBytes = 0;
let meta = null;
let finalBlob = null;

btnRecvRun.addEventListener("click", () => {
  const code = recvCodeInput.value.trim();
  if (code.length !== 6) {
    alert("Please enter the complete 6-digit verification code!");
    return;
  }

  btnRecvRun.disabled = true;
  btnDownload.style.display = "none";
  receivedChunks = [];
  receivedBytes = 0;

  recvLog.innerHTML = `Punching through NAT/Firewall to Sender (Code: ${code})...`;

  if (peer) peer.destroy();
  peer = new Peer(RTC_CONFIG);

  peer.on("open", () => {
    conn = peer.connect(PREFIX + code, { reliable: true });

    conn.on("open", () => {
      recvLog.innerHTML = `<span class="val">Cross-City Pipe Established!</span> Ingesting stream...`;
    });

    conn.on("data", async (data) => {
      if (data.type === "meta") {
        meta = data;
      } else if (data.type === "chunk") {
        receivedChunks.push(new Uint8Array(data.data));
        receivedBytes += data.data.length;

        if (meta && meta.totalBytes) {
          const pct = Math.round((receivedBytes / meta.totalBytes) * 100);
          recvProgress.value = pct;
          recvProgressLabel.innerText = `Transfer Progress: ${pct}% (${(receivedBytes/(1024*1024)).toFixed(1)} MB)`;
        }
      } else if (data.type === "done") {
        recvLog.innerHTML = `Decrypting with AES-256-GCM and Decompressing...`;

        try {
          const ciphertext = new Uint8Array(receivedBytes);
          let off = 0;
          for (let c of receivedChunks) { ciphertext.set(c, off); off += c.length; }

          const salt = new Uint8Array(meta.salt);
          const iv = new Uint8Array(meta.iv);
          const key = await deriveKey(code, salt);
          const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);

          const plainBytes = await decompress(new Uint8Array(decrypted));
          finalBlob = new Blob([plainBytes], { type: "application/octet-stream" });

          btnDownload.style.display = "block";
          btnDownload.innerText = `Download ${meta.name} (${(finalBlob.size / (1024*1024)).toFixed(1)} MB)`;
          recvLog.innerHTML = `<span class="val">Verified & Decrypted!</span> File ready to download.`;
          btnRecvRun.disabled = false;

        } catch (err) {
          console.error(err);
          recvLog.innerHTML = `<span class="err">Decryption Failed! Code mismatch or transmission interrupted.</span>`;
          btnRecvRun.disabled = false;
        }
      }
    });

    conn.on("error", () => {
      recvLog.innerHTML = `<span class="err">Connection to sender was lost.</span>`;
      btnRecvRun.disabled = false;
    });
  });

  peer.on("error", (err) => {
    recvLog.innerHTML = `<span class="err">Could not locate sender room. Verify the 6-digit code or ensure sender is still on the page.</span>`;
    btnRecvRun.disabled = false;
  });
});

btnDownload.addEventListener("click", () => {
  if (!finalBlob) return;
  const url = URL.createObjectURL(finalBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = meta.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
