<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPipe - Ultra-Reliable P2P Streamer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #090d16; --card: #131b2e; --border: #233354;
      --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .wrapper { max-width: 620px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; }
    .mode-btn { padding: 12px; font-weight: bold; border: none; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: 0.2s; font-size: 14px; }
    .mode-btn.active { background: var(--accent); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    h2 { font-size: 16px; color: var(--accent); }
    label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    input[type="file"] { padding: 10px; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; width: 100%; }
    input[type="text"] { padding: 12px; background: #0b1120; border: 2px solid var(--border); border-radius: 6px; color: #fff; font-size: 24px; text-align: center; letter-spacing: 6px; font-weight: bold; width: 100%; }
    input[type="text"]:focus { border-color: var(--accent); outline: none; }
    
    .btn-row { display: flex; gap: 10px; }
    button.action { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--accent); color: #000; transition: 0.2s; }
    button.action:disabled { opacity: 0.35; cursor: not-allowed; }
    button.cancel-btn { padding: 12px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; background: var(--red); color: #fff; display: none; transition: 0.2s; }
    button.cancel-btn:hover { filter: brightness(1.15); }

    .code-display { background: #0b1120; border: 2px dashed var(--green); border-radius: 8px; padding: 14px; text-align: center; }
    .code-val { font-size: 32px; font-weight: 900; color: var(--green); letter-spacing: 6px; margin-top: 4px; }
    .status { font-size: 12px; color: var(--muted); line-height: 1.5; background: #0b1120; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .val { color: var(--green); font-weight: bold; }
    .err { color: var(--red); font-weight: bold; }
    progress { width: 100%; height: 8px; accent-color: var(--green); }
    .btn-download { background: var(--green); color: #000; display: none; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="mode-switch">
    <button class="mode-btn active" id="tabSender">Sender Mode</button>
    <button class="mode-btn" id="tabReceiver">Receiver Mode</button>
  </div>

  <!-- SENDER VIEW -->
  <div class="card" id="senderView">
    <h2>1. Sender Mode (Reliable Stream)</h2>
    <label>Select File</label>
    <input type="file" id="filePicker" />
    
    <div class="btn-row">
      <button class="action" id="btnSenderRun" disabled>Create Room & Generate Code</button>
      <button class="cancel-btn" id="btnSenderCancel">Cancel Transfer</button>
    </div>

    <label id="senderProgressLabel">Transfer Progress: 0%</label>
    <progress id="senderProgress" value="0" max="100"></progress>

    <div class="code-display">
      <div style="font-size:11px; color:var(--muted);">GIVE THIS CODE TO RECEIVER</div>
      <div class="code-val" id="dispCode">------</div>
    </div>

    <div class="status" id="senderLog">Select a file and click "Create Room & Generate Code".</div>
  </div>

  <!-- RECEIVER VIEW -->
  <div class="card" id="receiverView" style="display: none;">
    <h2>2. Receiver Mode</h2>
    <label>Enter 6-Digit Code</label>
    <input type="text" id="recvCodeInput" maxlength="6" placeholder="------" />
    
    <div class="btn-row">
      <button class="action" id="btnRecvRun">Connect & Download Stream</button>
      <button class="cancel-btn" id="btnRecvCancel">Cancel Transfer</button>
    </div>

    <label id="recvProgressLabel">Transfer Progress: 0%</label>
    <progress id="recvProgress" value="0" max="100"></progress>

    <div class="status" id="recvLog">Enter the code and click Connect.</div>
    <button class="btn-download" id="btnDownload">Save File</button>
  </div>
</div>

<script>
const PREFIX = "pixelpipe-rel-";
const CHUNK_SIZE = 128 * 1024; // 128KB chunks: optimal throughput without overflowing buffers

const RTC_CONFIG = {
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" }
    ]
  }
};

let peer = null;
let activeConn = null;
let isCancelled = false;

// UI Tabs
const tabSender = document.getElementById("tabSender");
const tabReceiver = document.getElementById("tabReceiver");
const senderView = document.getElementById("senderView");
const receiverView = document.getElementById("receiverView");

tabSender.addEventListener("click", () => {
  tabSender.classList.add("active"); tabReceiver.classList.remove("active");
  senderView.style.display = "flex"; receiverView.style.display = "none";
});

tabReceiver.addEventListener("click", () => {
  tabReceiver.classList.add("active"); tabSender.classList.remove("active");
  receiverView.style.display = "flex"; senderView.style.display = "none";
});

// Crypto
async function deriveKey(codeStr, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey("raw", enc.encode(codeStr), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 20000, hash: "SHA-256" },
    keyMat,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

// --- SENDER ---
const filePicker = document.getElementById("filePicker");
const btnSenderRun = document.getElementById("btnSenderRun");
const btnSenderCancel = document.getElementById("btnSenderCancel");
const dispCode = document.getElementById("dispCode");
const senderProgress = document.getElementById("senderProgress");
const senderProgressLabel = document.getElementById("senderProgressLabel");
const senderLog = document.getElementById("senderLog");

let currentFile = null;

filePicker.addEventListener("change", () => {
  currentFile = filePicker.files[0];
  btnSenderRun.disabled = !currentFile;
  if (currentFile) {
    senderLog.innerHTML = `Selected: <b>${currentFile.name}</b> (${(currentFile.size / (1024*1024)).toFixed(1)} MB). Click below to create room.`;
  }
});

btnSenderCancel.addEventListener("click", () => {
  isCancelled = true;
  if (activeConn && activeConn.open) {
    activeConn.send({ type: "cancel" });
  }
  setTimeout(() => {
    if (activeConn) { activeConn.close(); activeConn = null; }
    if (peer) { peer.destroy(); peer = null; }
    resetSenderUI("Transfer cancelled by you.");
  }, 100);
});

function resetSenderUI(msg) {
  btnSenderRun.disabled = !currentFile;
  btnSenderCancel.style.display = "none";
  dispCode.innerText = "------";
  senderProgress.value = 0;
  senderProgressLabel.innerText = "Transfer Progress: 0%";
  senderLog.innerHTML = `<span class="err">${msg}</span>`;
}

btnSenderRun.addEventListener("click", async () => {
  btnSenderRun.disabled = true;
  btnSenderCancel.style.display = "block";
  isCancelled = false;

  const file = currentFile;
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(code, salt);

  if (peer) peer.destroy();
  peer = new Peer(PREFIX + code, RTC_CONFIG);

  peer.on("open", () => {
    dispCode.innerText = code;
    senderLog.innerHTML = `
      <span class="val">Room Created!</span><br/>
      Give this code to receiver: <b>${code}</b><br/>
      <i>Waiting for receiver to connect...</i>
    `;
  });

  peer.on("connection", (conn) => {
    activeConn = conn;
    senderLog.innerHTML = `<span class="val">Receiver Connected!</span> Starting transfer...`;

    conn.on("open", async () => {
      const fileSize = file.size;
      const totalChunks = Math.ceil(fileSize / CHUNK_SIZE);

      // Send initial metadata
      conn.send({
        type: "meta",
        name: file.name,
        size: fileSize,
        salt: Array.from(salt),
        totalChunks: totalChunks
      });

      // Flow Control: Promise-based acknowledgment handler
      let waitingForAck = null;

      conn.on("data", (msg) => {
        if (msg.type === "ack" && waitingForAck) {
          waitingForAck();
          waitingForAck = null;
        } else if (msg.type === "cancel") {
          isCancelled = true;
          resetSenderUI("Transfer cancelled by receiver.");
          if (activeConn) { activeConn.close(); activeConn = null; }
          if (peer) { peer.destroy(); peer = null; }
        }
      });

      // Stream Chunks with Reliable Flow Control
      for (let i = 0; i < totalChunks; i++) {
        if (isCancelled) return;

        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, fileSize);
        const sliceBlob = file.slice(start, end);
        const rawBuffer = new Uint8Array(await sliceBlob.arrayBuffer());

        if (isCancelled) return;

        // Encrypt Chunk
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, rawBuffer));

        if (isCancelled) return;

        // Send Chunk Payload
        conn.send({
          type: "chunk",
          chunkIdx: i,
          iv: Array.from(iv),
          payload: encrypted
        });

        // Wait for receiver ACK before sending next chunk (guarantees 0% stall never happens)
        await new Promise(resolve => {
          waitingForAck = resolve;
          // Fallback timeout in case packet dropped
          setTimeout(resolve, 300);
        });

        const pct = Math.round(((i + 1) / totalChunks) * 100);
        senderProgress.value = pct;
        senderProgressLabel.innerText = `Sent: ${pct}% (${i + 1}/${totalChunks} chunks)`;
      }

      if (!isCancelled) {
        conn.send({ type: "complete" });
        senderLog.innerHTML = `<span class="val">Transfer Complete!</span> Successfully delivered.`;
        btnSenderCancel.style.display = "none";
      }
    });

    conn.on("close", () => {
      if (!isCancelled) resetSenderUI("Receiver closed the connection.");
    });
  });

  peer.on("error", (err) => {
    senderLog.innerHTML = `<span class="err">Connection Error: ${err.type}</span>. Retrying...`;
    btnSenderRun.disabled = false;
    btnSenderCancel.style.display = "none";
  });
});

// --- RECEIVER ---
const recvCodeInput = document.getElementById("recvCodeInput");
const btnRecvRun = document.getElementById("btnRecvRun");
const btnRecvCancel = document.getElementById("btnRecvCancel");
const recvProgress = document.getElementById("recvProgress");
const recvProgressLabel = document.getElementById("recvProgressLabel");
const recvLog = document.getElementById("recvLog");
const btnDownload = document.getElementById("btnDownload");

let meta = null;
let receivedBlobs = [];
let derivedRecvKey = null;

btnRecvCancel.addEventListener("click", () => {
  isCancelled = true;
  if (activeConn && activeConn.open) {
    activeConn.send({ type: "cancel" });
  }
  setTimeout(() => {
    if (activeConn) { activeConn.close(); activeConn = null; }
    if (peer) { peer.destroy(); peer = null; }
    resetReceiverUI("Transfer cancelled by you.");
  }, 100);
});

function resetReceiverUI(msg) {
  btnRecvRun.disabled = false;
  btnRecvCancel.style.display = "none";
  btnDownload.style.display = "none";
  recvProgress.value = 0;
  recvProgressLabel.innerText = "Transfer Progress: 0%";
  recvLog.innerHTML = `<span class="err">${msg}</span>`;
  receivedBlobs = [];
  activeConn = null;
}

btnRecvRun.addEventListener("click", () => {
  const code = recvCodeInput.value.trim();
  if (code.length !== 6) {
    alert("Please enter the complete 6-digit verification code!");
    return;
  }

  btnRecvRun.disabled = true;
  btnRecvCancel.style.display = "block";
  btnDownload.style.display = "none";
  isCancelled = false;
  receivedBlobs = [];
  recvProgress.value = 0;
  recvProgressLabel.innerText = "Transfer Progress: 0%";

  recvLog.innerHTML = `Locating Sender (Room: ${code})...`;

  if (peer) peer.destroy();
  peer = new Peer(RTC_CONFIG);

  peer.on("open", () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });
    activeConn = conn;

    conn.on("open", () => {
      recvLog.innerHTML = `<span class="val">Connected!</span> Waiting for incoming stream...`;
    });

    conn.on("data", async (msg) => {
      if (isCancelled) return;

      if (msg.type === "cancel") {
        isCancelled = true;
        resetReceiverUI("Transfer cancelled by sender.");
        if (activeConn) { activeConn.close(); activeConn = null; }
        if (peer) { peer.destroy(); peer = null; }
        return;
      }

      if (msg.type === "meta") {
        meta = msg;
        derivedRecvKey = await deriveKey(code, new Uint8Array(meta.salt));
        recvLog.innerHTML = `Receiving <b>${meta.name}</b> (${(meta.size / (1024*1024)).toFixed(1)} MB)...`;
      } 
      else if (msg.type === "chunk") {
        // Send immediate acknowledgment back to sender to unlock next chunk
        conn.send({ type: "ack" });

        // Decrypt chunk
        const iv = new Uint8Array(msg.iv);
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, derivedRecvKey, msg.payload);
        receivedBlobs.push(new Blob([decrypted]));

        const pct = Math.round((receivedBlobs.length / meta.totalChunks) * 100);
        recvProgress.value = pct;
        recvProgressLabel.innerText = `Received: ${pct}% (${receivedBlobs.length}/${meta.totalChunks} chunks)`;
      } 
      else if (msg.type === "complete") {
        recvLog.innerHTML = `<span class="val">Transfer Complete!</span> Ready to save.`;
        btnDownload.style.display = "block";
        btnDownload.innerText = `Save ${meta.name}`;
        btnRecvRun.disabled = false;
        btnRecvCancel.style.display = "none";
      }
    });

    conn.on("close", () => {
      if (!isCancelled) resetReceiverUI("Sender disconnected.");
    });
  });

  peer.on("error", (err) => {
    recvLog.innerHTML = `<span class="err">Could not connect to room. Verify the code.</span>`;
    btnRecvRun.disabled = false;
    btnRecvCancel.style.display = "none";
  });
});

btnDownload.addEventListener("click", () => {
  if (receivedBlobs.length === 0) return;
  const finalBlob = new Blob(receivedBlobs, { type: "application/octet-stream" });
  const url = URL.createObjectURL(finalBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = meta.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
